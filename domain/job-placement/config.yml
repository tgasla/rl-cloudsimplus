# train_model_dir: applicable only if mode == [transfer|test]
# java_log_destination: comma-separated list of [stdout, file] (e.g. "stdout", "file", "stdout,file"). Order does not matter. Use "none" to suppress all logging.
# java_log_level: [TRACE, DEBUG, INFO, WARNING, ERROR]
# seed: random or any integer
# base_log_dir: parent directory for all logs
# experiment_dir: parent directory for a set of experiments
# experiment_name: name of the experiment
# mode: [train, test, transfer]
# on_exists: [abort, archive] - what to do when this run's directory already holds
#   a completed run. A run directory is written exactly once; results are never
#   merged. Per-experiment only, do not put it in common:.
#     absent / abort : this experiment is skipped, the queue continues (default)
#     archive        : the previous run is moved to
#                      <base_log_dir>/_archive/<experiment_dir>/<experiment_name>/<UTC stamp>/
#   A run that CRASHED or was killed is archived automatically, no flag needed.
#
# Job placement is a TWO-STAGE decision pipeline:
#   1. Pick the DATACENTER for the cloudlet  → cloudlet_to_dc_mapping
#   2. Pick the VM WITHIN that DC            → cloudlet_to_vm_mapping
# The RL agent operates on stage 1 (when set to 'rl'). Stage 2 is always rule-based.
# VM-to-host placement is always handled internally by bestfit (not configurable).
#
# cloudlet_to_dc_mapping: [rl, earliest-shortest-to-most-free-dc, earliest-most-critical-to-nearest-dc]
# cloudlet_to_vm_mapping: [most-free-pes]
# rl_algorithm: any stable-baselines3 or sb3-contrib algorithm. Read only when cloudlet_to_dc_mapping == rl.

common:
  timestep_interval: 1.0
  min_time_between_events: 0.1
  max_episode_length: 150
  split_large_jobs: false  # RING-N jobs carry per-PE MI; splitting would divide it by cores
  clear_created_lists: false
  vm_startup_delay: 0.0
  vm_shutdown_delay: 0.0
  base_log_dir: logs
  print_stats: false
  cloudlet_to_dc_mapping: rl
  cloudlet_to_vm_mapping: most-free-pes
  state_space_type: dcid-dctype-vmcap-freepes-backlog-per-host
  freeze_inactive_input_layer_weights: false # keep false if autoencoder or embeddings are used
  # Shape constants: they fix the observation (960 + 192 + 768) and action spaces, so
  # changing any of them invalidates every trained checkpoint.
  max_datacenters: 24   # action 0 is the no-op, so 23 addressable DCs
  max_datacenter_types: 3
  max_hosts: 8          # per-DC host cap
  total_hosts: 192      # host slots in the observation
  max_host_pes: 32
  max_jobs_waiting: 32  # jobs decided per timestep (head by due time)
  max_job_pes: 8
  mips_ref: 60          # PE speed that defines one unit of nominal job runtime
  # RING-N experiments set benchmark_member (a manifest id, e.g. S) and include its topology
  # (datacenters: !include topologies/ring/S.yml); every episode then plays a fresh level.
  ring_manifest: topologies/ring/manifest.json
  level_split: train    # train | val | test | lockbox
  val_every: 100000     # RING-N training: val sweep interval (steps); best_val_model is kept
  val_num_cpu: 8        # workers for the val sweeps, on their own JVMs
  max_job_delay_sensitivity_levels: 3
  max_job_deadline: 20
  n_rollout_steps: 128
  # Net-SLA reward: a job earns sla_value_<class> if it finishes by arrival + deadline,
  # otherwise pays sla_penalty_<class>; placing it costs cost_<tier> per reference core-second.
  sla_value_tolerant: 1.0
  sla_value_moderate: 2.0
  sla_value_critical: 4.0
  sla_penalty_tolerant: 0.5
  sla_penalty_moderate: 2.0
  sla_penalty_critical: 6.0
  cost_cloud: 0.005
  cost_edge: 0.010
  cost_micro: 0.020
  network_delay_cloud: 3.0   # timesteps from binding until the job reaches the DC
  network_delay_edge: 1.0
  network_delay_micro: 0.0
  reward_shaping: false
  reward_shaping_gamma: 0.99  # must equal the algorithm's gamma (checked at startup)
  seed: 1234
  rl_algorithm: MaskablePPO
  gpu: true
  attached: false
  num_cpu: 16
  save_experiment: true
  java_log_level: INFO
  java_log_destination: none

