# train_model_dir: applicable only if mode == [transfer|test]
# globals.java_log_destination: comma-separated list of [stdout, file] (e.g. "stdout", "file", "stdout,file"). Order does not matter. Use "none" to suppress all logging.
# globals.junit_output_show: [true, false] - if true, junit test results are printed to stdout
# globals.java_log_level: [TRACE, DEBUG, INFO, WARNING, ERROR]
# seed: random or any integer
# base_log_dir: parent directory for all logs
# experiment_dir: parent directory for a set of experiments
# experiment_name: name of the experiment
# mode: [train, test, transfer]
#
# Job placement is a TWO-STAGE decision pipeline:
#   1. Pick the DATACENTER for the cloudlet  → cloudlet_to_dc_mapping
#   2. Pick the VM WITHIN that DC            → cloudlet_to_vm_mapping
# The RL agent operates on stage 1 (when set to 'rl'). Stage 2 is always rule-based.
# VM-to-host placement is always handled internally by bestfit (not configurable).
#
# cloudlet_to_dc_mapping: [rl, earliest-shortest-to-most-free-dc, earliest-shortest-to-nearest-dc, earliest-most-critical-to-nearest-dc]
# cloudlet_to_vm_mapping: [most-free-pes]
# rl_algorithm: any stable-baselines3 or sb3-contrib algorithm. Read only when cloudlet_to_dc_mapping == rl.

# if you make any changes in java_log_leve, java_log_destination or java_output_show, 
#  you need to execute make build-gateway for the changes to take effect
globals:
    attached: true
    gpu: false
    java_log_level: INFO
    java_log_destination: none
    junit_output_show: false
    num_cpu: 16
    save_experiment: true

common:
  timestep_interval: 1.0
  min_time_between_events: 0.1
  max_episode_length: 150
  split_large_jobs: true
  clear_created_lists: false
  vm_startup_delay: 0.0
  vm_shutdown_delay: 0.0
  base_log_dir: logs
  batch_size: 64
  print_stats: false
  # cloudlet_to_dc_mapping:  earliest-most-critical-to-nearest-dc
  cloudlet_to_dc_mapping: rl
  cloudlet_to_vm_mapping: most-free-pes
  state_space_type: dcid-dctype-freevmpes-per-host
  autoencoder_infr_obs: false # for now, autoencoder observation affects only the infrastructure state
  autoencoder_infr_obs_latent_dim: 32
  freeze_inactive_input_layer_weights: false # keep false if autoencoder or embeddings are used
  max_datacenters: 8
  max_datacenter_types: 3
  max_hosts: 40
  max_host_pes: 64
  max_jobs_waiting: 50
  max_job_pes: 16
  max_job_delay_sensitivity_levels: 3
  max_job_deadline: 20
  timesteps: 2048
  n_rollout_steps: 128
  reward_jobs_placed_coef: 0.333
  reward_quality_coef: 0.333
  reward_deadline_violation_coef: 0.333
  seed: 1234
  rl_algorithm: MaskablePPO

experiment_1:
  mode: train
  datacenters: !include topologies/euromlsys_a.yml
  experiment_dir: euromlsys
  experiment_name: env_a_train
  job_trace_filename: euromlsys_jobs_first_50.csv

