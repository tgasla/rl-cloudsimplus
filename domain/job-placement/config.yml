# ── GATE A part 1: the three rule-based heuristics, never previously executed ──
# Purpose: establish whether hand-written rules are separable on this reward at all.
# If (best - worst) < 5*sigma_ep, no feature extractor will separate either.

- mode: train
  timesteps: 20000
  cloudlet_to_dc_mapping: earliest-shortest-to-most-free-dc
  datacenters: !include topologies/euromlsys_a.yml
  experiment_dir: euromlsys/gate_a_heuristics
  experiment_name: most_free_env_a
  job_trace_filename: euromlsys_jobs_first_50.csv
  feature_extractor: euromlsys


