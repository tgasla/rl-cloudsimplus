# train_model_dir: applicable only if mode == [transfer|test]
# globals.java_log_destination: comma-separated list of [stdout, file] (e.g. "stdout", "file", "stdout,file"). Order does not matter. Use "none" to suppress all logging.
# globals.junit_output_show: [true, false] - if true, junit test results are printed to stdout
# globals.java_log_level: [TRACE, DEBUG, INFO, WARNING, ERROR]
# seed: random or any integer
# base_log_dir: parent directory for all logs
# experiment_dir: parent directory for a set of experiments
# experiment_name: name of the experiment
# mode: [train, test, transfer]
# vm_allocation_policy: [rl, fromfile, minimize-queue, minimize-allocated, minimize-unutilized]
#   - rl       : RL agent decides VM lifecycle + host placement (uses VmAllocationPolicyCustom)
#   - fromfile : replay recorded actions from a file (uses VmAllocationPolicyCustom)
#   - minimize-* : rule-based VM lifecycle (when/which to create/destroy);
#                  bestfit decides host placement under the hood
# rl_algorithm: any stable-baselines3 / sb3-contrib algorithm. Read only when vm_allocation_policy == rl.

# java_log_level and java_log_destination: changes take effect at runtime — no rebuild needed.
# junit_output_show: requires make build-gateway to rebuild (Java test output).
globals:
    attached: true
    gpu: false
    java_log_level: INFO
    java_log_destination: none
    junit_output_show: false
    num_cpu: 16
    save_experiment: true

common:
    seed: 1234
    mode: train
    min_time_between_events: 0.1
    timestep_interval: 1.0
    max_episode_length: 100
    vm_startup_delay: 0.0
    vm_shutdown_delay: 0.0
    split_large_jobs: true
    clear_created_lists: true
    print_stats: false
    base_log_dir: logs
    max_hosts: 32
    max_job_pes: 8
    job_trace_filename: three_60max_8maxcores.csv
    datacenters: !include topologies/tcc.yml
    vm_types:
      - pes: 2
        pe_mips: 50000
        ram: 8192
        size: 4000
        bw: 1000
      - pes: 4
        pe_mips: 50000
        ram: 16384
        size: 4000
        bw: 1000
      - pes: 8
        pe_mips: 50000
        ram: 32768
        size: 4000
        bw: 1000
    timesteps: 2048         # 1M timesteps (recommended minimum for RL learning)
    n_rollout_steps: 128      # per-worker rollout steps. So, total rollout steps are x num_cpu
    reward_job_wait_coef: 0.33
    reward_running_vm_cores_coef: 0.33
    reward_unutilized_vm_cores_coef: 0.33
    reward_invalid_coef: 0.0  # 0.0 for MaskablePPO (masks guarantee validity); >0 for ablation without masks
    # Set to false to disable sending tree array observation (faster gRPC communication)
    send_observation_tree_array: false
    # Feature extractor: 'default' uses standard MLP, 'custom' uses CustomFeatureExtractor
    feature_extractor: default
    features_dim: 64
    embedding_size: 32
    hidden_dim: 128
    adaptation_bottleneck: false

experiment_1:
    mode: train
    experiment_dir: debug
    experiment_name: test1_test
    vm_allocation_policy: rl
    rl_algorithm: MaskablePPO
